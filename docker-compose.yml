services:
  postgres:
    image: postgres:15
    container_name: project_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: call_center
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - project_network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: project_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - project_network
      
  airflow-init:
    build: ./docker/airflow
    container_name: project_airflow_init
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@local.dev || true"
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PG_HOST: postgres
      PG_PORT: "5432"
      CH_HOST: clickhouse
      CH_PORT: "8123"
      PYTHONPATH: /opt/airflow
    volumes:
      - airflow_db:/opt/airflow
    networks:
      - project_network

  airflow-webserver:
    build: ./docker/airflow
    container_name: project_airflow_webserver
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - airflow_db:/opt/airflow
    networks:
      - project_network

  airflow-scheduler:
    build: ./docker/airflow
    container_name: project_airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - airflow_db:/opt/airflow
    networks:
      - project_network

volumes:
  postgres_data:
  clickhouse_data:
  airflow_db:

networks:
  project_network:
    driver: bridge