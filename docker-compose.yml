version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: project_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: call_center
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - project_network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: project_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - project_network

volumes:
  postgres_data:
  clickhouse_data:

networks:
  project_network:
    driver: bridge
